name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Monatlich neu bauen (aktualisiert das "Stand"-Datum und die Jahreszahl in den Titeln)
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: python3 test_build.py

      - name: Website bauen
        run: python3 build.py --strict
        env:
          # Optional: Impressum aus Repository-Secrets statt aus config.json
          IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
          IMPRESSUM_STRASSE: ${{ secrets.IMPRESSUM_STRASSE }}
          IMPRESSUM_PLZ_ORT: ${{ secrets.IMPRESSUM_PLZ_ORT }}
          IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}

      # GitHub pausiert geplante Läufe nach 60 Tagen ohne Aktivität im Repository.
      # Ein kleiner Monats-Commit hält den Zeitplan dauerhaft am Leben.
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        run: |
          date -u +%Y-%m-%d > STAND.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAND.txt
          git commit -m "Monatlicher Neubau" || echo "nichts zu committen"
          git push || echo "Push nicht möglich – Website wird trotzdem gebaut"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Bing, Ecosia, DuckDuckGo & Co. sofort über neue und geänderte Seiten informieren (Google nutzt IndexNow nicht)
      - uses: actions/checkout@v4
      - name: Suchmaschinen informieren (IndexNow)
        continue-on-error: true
        run: python3 tools/indexnow.py
